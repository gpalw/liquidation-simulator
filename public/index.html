<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>清算模拟器 (多进程版)</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <div id="app">
        <div id="login-screen">
            <h1>高可靠性批量清算模拟器</h1>
            <p>请先登录以继续</p>
            <button id="google-login-btn">使用 Google 登录</button>
        </div>

        <div id="main-app">
            <div class="controls">
                <div>
                    <label for="accounts-count">账户数量:</label>
                    <input type="number" id="accounts-count" value="3000">
                </div>
                <div>
                    <label for="user-id">用户ID (已认证):</label>
                    <input type="text" id="user-id" value="loading..." disabled>
                </div>
                <button id="start-button" disabled>正在连接...</button>
            </div>

            <div class="status">
                <h2>实时总进度</h2>
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
                <div id="progress-text">正在连接到服务器...</div>

                <h2 style="margin-top: 1.5em;">Worker 实时监控 (共 <span id="worker-count">0</span> 个)</h2>
                <div id="worker-monitor">
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
