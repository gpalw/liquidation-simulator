<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>清算模拟器 (多进程版)</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <div id="app">
        <div id="login-screen">
            <h1>高可靠性批量清算模拟器</h1>

            <p>请先登录以继续</p>
            <button id="google-login-btn">使用 Google 登录</button>
        </div>

        <div id="main-app">
            <div class="controls">
                <div>
                    <label for="accounts-count">账户数量:</label>
                    <input type="number" id="accounts-count" value="3000" max="20000">
                </div>

                <div class="form-row">
                    <div class="label-with-tip">
                        <label for="error-rate">模拟错误率 (%):</label>
                        <span class="tooltip-container">
                            <span class="tooltip-icon">?</span>
                            <div class="tooltip-text">
                                这是每个任务<b>单次</b>执行的失败率。系统最多重试 3 次，
                                最终失败率 ≈ (错误率)^3。例：20% → 0.2^3=0.8%, 80% → 0.8^3=51.2%
                            </div>
                        </span>
                    </div>

                    <input type="number" id="error-rate" value="0" min="0" max="100">
                </div>

                <div>
                    <label for="user-id">用户ID (已认证):</label>
                    <input type="text" id="user-id" value="loading..." disabled>
                </div>

                <button id="start-button" disabled>正在连接...</button>
            </div>
            <p class="note">
                模拟参数: 每个任务耗时 0.5-1.5 秒
            </p>
            <div class="status">
                <h2>实时总进度</h2>
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                    <div id="progress-fail"></div>
                </div>
                <div id="progress-text">正在连接到服务器...</div>

                <h2 style="margin-top: 1.5em;">Worker 实时监控 (共 <span id="worker-count">0</span> 个)</h2>
                <div id="worker-monitor">
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
